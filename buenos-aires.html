<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Buenos Aires 2026 🇦🇷</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #faf8f5;
      color: #222;
    }

    .container {
      width: 90%;
      max-width: 900px;
      margin: auto;
    }

    .volver {
      display: inline-block;
      margin-top: 30px;
      text-decoration: none;
      color: #555;
      font-size: 15px;
    }

    header {
      text-align: center;
      padding: 60px 20px 40px;
    }

    header .bandera {
      font-size: 55px;
    }

    header h1 {
      font-size: 45px;
      margin: 15px 0 8px;
    }

    header p {
      color: #888;
      font-size: 18px;
      margin: 5px;
    }

    .intro {
      text-align: center;
      max-width: 600px;
      margin: 0 auto 50px;
      color: #666;
      line-height: 1.6;
    }

    .galeria {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding-bottom: 60px;
    }

    .foto {
      background: #e8e3de;
      border-radius: 15px;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 14px;
      overflow: hidden;
    }

    .foto.grande {
      grid-column: span 2;
      aspect-ratio: 16 / 9;
    }

    .foto img,
    .foto video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    footer {
      text-align: center;
      padding: 30px 20px 50px;
      color: #aaa;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 36px;
      }

      .galeria {
        gap: 8px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <a class="volver" href="index.html">← Nuestros viajes</a>

  <header>
    <div class="bandera">🇦🇷</div>
    <h1>Buenos Aires</h1>
    <p>4 — 10 Octubre 2026</p>
  </header>

  <div class="intro">
    Una semana en Buenos Aires ♡
  </div>

  <section class="galeria">

    <div class="foto grande">
      Nuestra portada 📸
    </div>

    <div class="foto">
      Foto 1
    </div>

    <div class="foto">
      Foto 2
    </div>

    <div class="foto">
      Foto 3
    </div>

    <div class="foto">
      Foto 4
    </div>

    <div class="foto grande">
      Video 🎥
    </div>

  </section>

</div>

<footer>
  Nina & Pau ✈️
</footer>

</body>
</html>
